org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Kotlin daemon configuration
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Gradle daemon configuration
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# If build fails with "Could not download ... storage.googleapis.com" or "No such host is known",
# the machine cannot reach Google's servers. Fix network/DNS or uncomment and set proxy below:
# systemProp.https.proxyHost=your-proxy-host
# systemProp.https.proxyPort=443
# systemProp.https.proxyUser=user
# systemProp.https.proxyPassword=pass
